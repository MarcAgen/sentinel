# SupportDesk -- intentionally vulnerable application (pedagogical use only)
#
# WARNING: the full monitoring stack (Wazuh + Prometheus + Grafana) requires
# 8-12 GB of available RAM. Wazuh indexer (OpenSearch) alone needs ~4 GB heap.
# Check your machine resources before starting the complete stack.
# Wazuh can take 5-15 minutes to become fully operational after first start.

services:
  supportdesk:
    build: .
    ports:
      - "3000:3000"
    environment:
      - SESSION_SECRET=dev-secret-change-in-prod
      - PORT=3000
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
    - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
